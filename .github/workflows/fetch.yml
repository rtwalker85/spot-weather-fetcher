name: Fetch weather data

on:
  schedule:
    # Runs hourly. Mountain weather changes fast, and GitHub Actions minutes
    # are free/unlimited on public repos, so there's no cost to checking
    # often. Each model in fetch_weather.py independently figures out its
    # own freshest available run -- polling hourly just means we always
    # grab the shortest (most accurate) lead time available at that moment,
    # even for models that only update every 6-12 hours themselves.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_weather.py
        timeout-minutes: 15
        run: python fetch_weather.py

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "Update latest.json"
          git push
