name: Fetch weather data

on:
  schedule:
    # Hourly. Mountain weather changes fast, the whole run costs ~4 seconds
    # and 3 API calls, and GitHub Actions is free on public repos -- so
    # there's no reason to check less often. Short-range models (HRDPS,
    # HRRR) refresh frequently and are the ones that matter most for
    # next-day planning.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_weather.py
        # Three API calls, ~4 seconds. The ceiling is only here so a hung
        # request can't leave the job running indefinitely.
        timeout-minutes: 5
        run: python fetch_weather.py

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "Update latest.json"
          git push
