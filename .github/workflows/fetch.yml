name: Fetch weather data

on:
  schedule:
    # Runs once daily at 12:00 UTC (~5am Mountain Standard Time / ~6am Mountain
    # Daylight Time -- GitHub's cron doesn't know about daylight saving, so this
    # drifts by an hour for part of the year).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_weather.py
        run: python fetch_weather.py

      - name: Commit and push latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "Update latest.json"
          git push
